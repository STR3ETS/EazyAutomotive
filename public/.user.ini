; Larger uploads for the Video Studio (reference videos).
; Note: PHP-FPM reads this per-directory. On Plesk you may also need to raise
; these in the panel under PHP Settings; the AI model (fal) still caps reference
; videos at roughly 50 MB / 15 seconds regardless of these values.
upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 600
